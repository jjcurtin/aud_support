<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Compare</title>
<style>
  :root { --red:#C5050C; --ink:#121212; --muted:#585758; --line:#CFCFCF; --soft:#F3F3F3; --blue:#036796; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:#fff; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 14px; border-bottom:3px solid var(--red); }
  h1 { font-size:16px; margin:0 8px 0 0; }
  .muted { color:var(--muted); font-size:13px; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  button:hover { border-color:var(--ink); }
  button.primary { background:var(--red); color:#fff; border-color:var(--red); }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  main { display:grid; grid-template-columns: 1fr 1.3fr; gap:14px; padding:12px 14px; }
  .now { font-size:20px; font-weight:700; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  label { font-size:13px; font-weight:600; display:block; margin:8px 0 4px; }
  input[type=text], textarea, select { width:100%; font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  textarea { min-height:70px; resize:vertical; }
  a { color:var(--blue); }
  .links a { display:block; font-size:13px; word-break:break-all; }
  .status { font-size:13px; margin-top:6px; min-height:1.2em; }
  .warn { color:var(--red); font-weight:600; }
  .bar { height:6px; background:var(--soft); border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar > div { height:100%; background:var(--red); width:0; }
  kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 4px; font-size:12px; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Activity compare</h1>
  <button id="openStar">1. Open STAR window (left)</button>
  <button id="openDio">2. Open dionysus window (right)</button>
  <span class="muted">Shrink this window to a strip at the bottom of the screen. <kbd>Alt</kbd>+<kbd>→</kbd> next, <kbd>Alt</kbd>+<kbd>←</kbd> back.</span>
</header>
<main>
  <section>
    <div class="muted">Activity <span id="pos"></span> of <span id="total"></span> · <span id="done"></span> reviewed</div>
    <div class="bar"><div id="prog"></div></div>
    <div class="now" id="name"></div>
    <div class="row">
      <button id="prev">← Previous</button>
      <button id="next" class="primary">Next →</button>
      <select id="jump" aria-label="Jump to activity" style="width:auto;max-width:260px"></select>
    </div>
    <div class="links">
      <a id="starLink" target="star_win"></a>
      <a id="dioLink" target="dio_win"></a>
    </div>
    <div class="status" id="status"></div>
  </section>
  <section>
    <label for="better">Which better?</label>
    <div class="row" id="quick">
      <button data-v="STAR">STAR</button>
      <button data-v="dionysus">dionysus</button>
      <button data-v="same">Same</button>
    </div>
    <input type="text" id="better" placeholder="or type your own">
    <label for="notes">Notes</label>
    <textarea id="notes"></textarea>
    <div class="row">
      <button id="csv">Download notes as CSV</button>
      <span class="muted">Same row order as your spreadsheet, so you can paste the two columns into “which better?” and “notes”.</span>
    </div>
  </section>
</main>

const KEY = 'activity-compare-v1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }
const get = (r) => saved[r.name] || { better: r.better, notes: r.notes };
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };

let i = 0;
try { i = Math.min(ROWS.length - 1, Math.max(0, +(localStorage.getItem(KEY + '-pos') || 0))); } catch (e) {}
let starWin = null, dioWin = null;
const $ = (id) => document.getElementById(id);

ROWS.forEach((r, k) => { const o = document.createElement('option'); o.value = k; o.textContent = (k + 1) + '. ' + r.name; $('jump').appendChild(o); });
$('total').textContent = ROWS.length;

function geom(side) {
  const W = screen.availWidth, H = screen.availHeight;
  const h = Math.max(400, H - 230);       // leave a strip at the bottom for this page
  const w = Math.floor(W / 2);
  return `popup=yes,width=${w},height=${h},left=${side === 'L' ? 0 : w},top=0`;
}
function openWin(which) {
  const r = ROWS[i];
  const w = which === 'star' ? window.open(r.star, 'star_win', geom('L')) : window.open(r.dio, 'dio_win', geom('R'));
  if (!w) { $('status').innerHTML = '<span class="warn">The browser blocked the pop-up. Allow pop-ups for this page (icon at the right end of the address bar), then click again.</span>'; return; }
  if (which === 'star') starWin = w; else dioWin = w;
  $('status').textContent = '';
  window.focus();
}
$('openStar').onclick = () => openWin('star');
$('openDio').onclick = () => openWin('dio');

function saveCurrent() {
  const r = ROWS[i];
  saved[r.name] = { better: $('better').value, notes: $('notes').value };
  persist();
}
function show() {
  const r = ROWS[i], s = get(r);
  $('pos').textContent = i + 1;
  $('name').textContent = r.name;
  $('jump').value = i;
  $('starLink').href = r.star; $('starLink').textContent = 'STAR: ' + r.star;
  $('dioLink').href = r.dio;  $('dioLink').textContent = 'dionysus: ' + r.dio;
  $('better').value = s.better; $('notes').value = s.notes;
  document.querySelectorAll('#quick button').forEach(b => b.classList.toggle('on', b.dataset.v === s.better));
  const done = ROWS.filter(x => (get(x).better || '').trim()).length;
  $('done').textContent = done;
  $('prog').style.width = (100 * done / ROWS.length) + '%';
  try { localStorage.setItem(KEY + '-pos', i); } catch (e) {}
  // load both windows if they are open
  let missing = [];
  if (starWin && !starWin.closed) starWin.location.href = r.star; else missing.push('STAR');
  if (dioWin && !dioWin.closed) dioWin.location.href = r.dio; else missing.push('dionysus');
  $('status').innerHTML = missing.length ? `<span class="warn">${missing.join(' and ')} window not open — use the buttons at the top.</span>` : '';
}
function go(k) { saveCurrent(); i = Math.min(ROWS.length - 1, Math.max(0, k)); show(); }
$('next').onclick = () => go(i + 1);
$('prev').onclick = () => go(i - 1);
$('jump').onchange = (e) => go(+e.target.value);
$('better').oninput = $('notes').oninput = () => { saveCurrent(); const done = ROWS.filter(x => (get(x).better || '').trim()).length; $('done').textContent = done; $('prog').style.width = (100 * done / ROWS.length) + '%'; };
document.querySelectorAll('#quick button').forEach(b => b.onclick = () => { $('better').value = b.dataset.v; saveCurrent(); show(); });
document.addEventListener('keydown', (e) => {
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); go(i + 1); }
  if (e.altKey && e.key === 'ArrowLeft')  { e.preventDefault(); go(i - 1); }
});
$('csv').onclick = () => {
  saveCurrent();
  const q = (s) => '"' + String(s || '').replace(/"/g, '""') + '"';
  const lines = ['activity,which better?,notes'].concat(ROWS.map(r => { const s = get(r); return [q(r.name), q(s.better), q(s.notes)].join(','); }));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'activity_compare_notes.csv'; a.click();
};
show();
</script>
