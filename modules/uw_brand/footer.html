<script>
  // Quarto places include-before/after-body inside <main>; lift the UW header
  // and footer out to <body> so they span the full page width like WiscWeb.
  (function () {
    var b = document.body;
    var skip = document.querySelector('.uw-skip-link');
    var hdr = document.getElementById('uw-header');
    var ftr = document.getElementById('uw-footer');
    if (hdr) b.insertBefore(hdr, b.firstChild);
    if (skip) b.insertBefore(skip, b.firstChild);
    if (ftr) b.appendChild(ftr);

    // Site menu: mobile "Menu" toggle + "STAR Recovery System" dropdown
    function setOpen(btn, open) {
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      var target = document.getElementById(btn.getAttribute('aria-controls'));
      if (target) target.classList.toggle('is-open', open);
    }
    var toggles = document.querySelectorAll('.uw-nav-toggle, .uw-sub-toggle');
    Array.prototype.forEach.call(toggles, function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        setOpen(btn, btn.getAttribute('aria-expanded') !== 'true');
      });
    });
    function closeSubs() {
      Array.prototype.forEach.call(document.querySelectorAll('.uw-sub-toggle'), function (btn) { setOpen(btn, false); });
    }
    document.addEventListener('click', function (e) { if (!e.target.closest('.uw-has-sub')) closeSubs(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSubs(); });

    // Wide tables: wrap each in a box that scrolls sideways on small screens,
    // so the rest of the page doesn't scroll with it
    Array.prototype.forEach.call(document.querySelectorAll('main table'), function (t) {
      if (t.parentNode.classList.contains('table-responsive')) return;
      var w = document.createElement('div');
      w.className = 'table-responsive';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
  })();
</script>
